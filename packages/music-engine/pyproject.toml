[project]
name = "drumscribe-music"
version = "0.1.0"
description = "Deterministic audio, rhythm, notation, and export engine for DrumScribe"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [{ name = "DrumScribe" }]
dependencies = []

[project.optional-dependencies]
audio = [
  "numpy>=2.0,<3",
  "scipy>=1.14,<2",
  "librosa>=0.10.2,<1",
  "soundfile>=0.12,<1",
]
demucs = ["demucs>=4.0.1,<5", "numpy>=2.0,<3"]
accurate-beats = ["beat-this>=1.1,<2"]
pdf = ["reportlab>=4.2,<5"]
dev = ["pytest>=9.0.3,<10", "pytest-cov>=5,<8", "ruff>=0.12,<1"]

[dependency-groups]
dev = ["pytest>=9.0.3,<10", "pytest-cov>=5,<8", "ruff>=0.12,<1"]

[project.scripts]
drumscribe-synthetic = "drumscribe_music.synthetic:main"

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/drumscribe_music"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
