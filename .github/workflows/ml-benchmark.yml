name: Optional ML benchmark

on:
  workflow_dispatch:
    inputs:
      manifest:
        description: Repository-relative licensed evaluation manifest
        required: true
        default: ml/data/example-benchmark.json

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --project ml --all-extras --dev
      - name: Evaluate supplied licensed benchmark predictions
        run: >-
          uv run --project ml drumscribe-benchmark
          "${{ inputs.manifest }}"
          --json benchmark.json
          --html benchmark.html
      - uses: actions/upload-artifact@v7
        with:
          name: ml-benchmark
          path: |
            benchmark.json
            benchmark.html
