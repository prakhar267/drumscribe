name: Optional ML benchmark

on:
  workflow_dispatch:
    inputs:
      manifest:
        description: Repository-relative licensed evaluation manifest
        required: true
        default: ml/data/example-manifest.json

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --project packages/music-engine --all-extras --dev
      - name: Benchmark deterministic provider
        run: >-
          uv run --project packages/music-engine drumscribe-benchmark
          --manifest "${{ inputs.manifest }}"
          --json-out benchmark.json
          --html-out benchmark.html
      - uses: actions/upload-artifact@v4
        with:
          name: ml-benchmark
          path: |
            benchmark.json
            benchmark.html

