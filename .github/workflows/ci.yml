name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  browser-e2e:
    runs-on: ubuntu-latest
    needs: web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @drumscribe/web exec playwright install --with-deps chromium
      - run: pnpm --filter @drumscribe/web exec playwright test --project=chromium
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-e2e-failure
          path: |
            apps/web/test-results
            apps/web/playwright-report
          if-no-files-found: ignore

  stack-e2e:
    runs-on: ubuntu-latest
    needs: [web, python, compose-config]
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @drumscribe/web exec playwright install --with-deps chromium
      - run: docker compose up --detach --build --wait --wait-timeout 180
      - name: Exercise the real browser/API/worker/storage stack
        run: pnpm --filter @drumscribe/web exec playwright test --project=chromium full-stack.spec.ts
        env:
          DRUMSCRIBE_FULL_STACK_E2E: "1"
      - name: Capture service logs after a failure
        if: failure()
        run: docker compose logs --no-color --tail=400
      - name: Stop acceptance stack
        if: always()
        run: docker compose down --volumes --remove-orphans

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --project packages/music-engine --extra pdf --group dev
      - run: uv run --project packages/music-engine ruff check packages/music-engine/src packages/music-engine/tests
      - run: uv run --project packages/music-engine ruff format --check packages/music-engine/src packages/music-engine/tests
      - run: uv run --project packages/music-engine pytest packages/music-engine/tests
      - run: uv sync --project ml --extra dev
      - run: uv run --project ml ruff check ml/src ml/tests
      - run: uv run --project ml ruff format --check ml/src ml/tests
      - run: uv run --project ml pytest ml/tests
      - run: uv sync --project apps/api --all-extras --dev
      - run: uv run --project apps/api ruff check apps/api/src apps/api/tests
      - run: uv run --project apps/api ruff format --check apps/api/src apps/api/tests
      - run: uv run --project apps/api mypy apps/api/src
      - run: uv run --project apps/api pytest apps/api/tests
      - run: uv run --project apps/api alembic -c apps/api/alembic.ini upgrade head
        env:
          DRUMSCRIBE_DATABASE_URL: sqlite+aiosqlite:///./migration-check.sqlite3
      - run: uv run --project apps/api alembic -c apps/api/alembic.ini check
        env:
          DRUMSCRIBE_DATABASE_URL: sqlite+aiosqlite:///./migration-check.sqlite3

  compose-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - run: docker compose config --quiet

  dependency-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Audit web dependencies with OSV
        uses: google/osv-scanner-action/osv-scanner-action@8deb546fdb875b9996d27d4950be7312dac076a1 # v2.5.0
        with:
          scan-args: |-
            --lockfile=pnpm-lock.yaml
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: Audit API dependencies
        run: |
          uv export --quiet --project apps/api --all-extras --no-dev --no-emit-local --output-file /tmp/api-requirements.txt
          uvx pip-audit --requirement /tmp/api-requirements.txt
      - name: Audit music-engine dependencies
        run: |
          uv export --quiet --project packages/music-engine --extra pdf --no-dev --no-emit-local --output-file /tmp/music-requirements.txt
          uvx pip-audit --requirement /tmp/music-requirements.txt
      - name: Audit ML runtime dependencies
        run: |
          uv export --quiet --project ml --no-dev --no-emit-local --output-file /tmp/ml-requirements.txt
          uvx pip-audit --requirement /tmp/ml-requirements.txt

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
