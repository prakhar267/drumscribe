name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --project packages/music-engine --all-extras --dev
      - run: uv run --project packages/music-engine ruff check packages/music-engine/src packages/music-engine/tests
      - run: uv run --project packages/music-engine pytest packages/music-engine/tests
      - run: uv sync --project ml --all-extras --dev
      - run: uv run --project ml ruff check ml/src ml/tests
      - run: uv run --project ml pytest ml/tests
      - run: uv sync --project apps/api --all-extras --dev
      - run: uv run --project apps/api ruff check apps/api/src apps/api/tests
      - run: uv run --project apps/api pytest apps/api/tests
      - run: uv run --project apps/api alembic -c apps/api/alembic.ini upgrade head
        env:
          DATABASE_URL: sqlite+aiosqlite:///./migration-check.sqlite3

  compose-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - run: docker compose config --quiet

  dependency-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --audit-level high
      - name: Audit API dependencies
        run: |
          uv export --project apps/api --all-extras --no-dev --output-file /tmp/api-requirements.txt
          uvx pip-audit --requirement /tmp/api-requirements.txt
      - name: Audit music-engine dependencies
        run: |
          uv export --project packages/music-engine --all-extras --no-dev --output-file /tmp/music-requirements.txt
          uvx pip-audit --requirement /tmp/music-requirements.txt

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
