[project]
name = "drumscribe-ml"
version = "0.1.0"
description = "Dataset governance and reproducible drum-transcription benchmarks"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["drumscribe-music==0.1.0", "numpy>=2.0,<3"]

[project.optional-dependencies]
dev = ["mido>=1.3,<2", "pytest>=8.3,<9", "pytest-cov>=5,<7", "ruff>=0.12,<1"]
data = ["mido>=1.3,<2"]
train = ["torch>=2.7,<3"]

[dependency-groups]
dev = ["mido>=1.3,<2", "pytest>=8.3,<9", "pytest-cov>=5,<7", "ruff>=0.12,<1"]

[project.scripts]
drumscribe-ml = "drumscribe_ml.cli:main"
drumscribe-benchmark = "drumscribe_ml.benchmark:main"
drumscribe-separation-benchmark = "drumscribe_ml.separation:main"
drumscribe-bakeoff = "drumscribe_ml.bakeoff:main"

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/drumscribe_ml"]

[tool.uv.sources]
drumscribe-music = { path = "../packages/music-engine", editable = true }

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
