name: drumscribe

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-drumscribe}
      POSTGRES_USER: ${POSTGRES_USER:-drumscribe}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-development-only}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-55432}:5432"
    restart: unless-stopped

  valkey:
    image: valkey/valkey:8-alpine
    command: ["valkey-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
    volumes:
      - valkey-data:/data
    ports:
      - "127.0.0.1:${VALKEY_HOST_PORT:-56379}:6379"
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-drumscribe-local}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-local-development-only}
      MINIO_API_CORS_ALLOW_ORIGIN: http://localhost:3000
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 12
    volumes:
      - minio-data:/data
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    restart: unless-stopped

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -ec
      - |
        mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}"
        mc mb --ignore-existing local/$${S3_BUCKET}
        mc anonymous set none local/$${S3_BUCKET}
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-drumscribe-local}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-local-development-only}
      S3_BUCKET: ${DRUMSCRIBE_S3_BUCKET:-drumscribe-private}
    restart: "no"

  api:
    build:
      context: .
      dockerfile: infra/docker/api.Dockerfile
    env_file:
      - path: .env
        required: false
    environment:
      DRUMSCRIBE_ENVIRONMENT: development
      DRUMSCRIBE_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-drumscribe}:${POSTGRES_PASSWORD:-local-development-only}@postgres:5432/${POSTGRES_DB:-drumscribe}
      DRUMSCRIBE_REDIS_URL: redis://valkey:6379/0
      DRUMSCRIBE_QUEUE_BACKEND: celery
      DRUMSCRIBE_STORAGE_BACKEND: s3
      DRUMSCRIBE_S3_ENDPOINT_URL: http://minio:9000
      DRUMSCRIBE_S3_PUBLIC_ENDPOINT_URL: http://localhost:9000
      DRUMSCRIBE_S3_BUCKET: ${DRUMSCRIBE_S3_BUCKET:-drumscribe-private}
      DRUMSCRIBE_S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY:-drumscribe-local}
      DRUMSCRIBE_S3_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:-local-development-only}
      # Local MinIO has no KMS configured. Production R2/Neon storage encrypts
      # objects at rest without requiring the AWS SSE request header.
      DRUMSCRIBE_S3_SERVER_SIDE_ENCRYPTION: "none"
      # The current MinIO image rejects S3 PutBucketCors; its container-level exact
      # origin is configured above. Managed production storage keeps this enabled.
      DRUMSCRIBE_S3_CONFIGURE_BUCKET_CORS: "false"
      DRUMSCRIBE_PUBLIC_API_URL: http://localhost:8000
      DRUMSCRIBE_WEB_ORIGINS: '["http://localhost:3000"]'
      DRUMSCRIBE_SESSION_SECRET: ${DRUMSCRIBE_SESSION_SECRET:-local-development-secret-change-before-deploying}
    command: ["sh", "-ec", "alembic upgrade head && uvicorn drumscribe_api.main:app --host 0.0.0.0 --port 8000"]
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/api/v1/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 12
    ports:
      - "127.0.0.1:8000:8000"
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: infra/docker/api.Dockerfile
    env_file:
      - path: .env
        required: false
    environment:
      DRUMSCRIBE_ENVIRONMENT: development
      DRUMSCRIBE_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-drumscribe}:${POSTGRES_PASSWORD:-local-development-only}@postgres:5432/${POSTGRES_DB:-drumscribe}
      DRUMSCRIBE_REDIS_URL: redis://valkey:6379/0
      DRUMSCRIBE_QUEUE_BACKEND: celery
      DRUMSCRIBE_STORAGE_BACKEND: s3
      DRUMSCRIBE_S3_ENDPOINT_URL: http://minio:9000
      DRUMSCRIBE_S3_PUBLIC_ENDPOINT_URL: http://localhost:9000
      DRUMSCRIBE_S3_BUCKET: ${DRUMSCRIBE_S3_BUCKET:-drumscribe-private}
      DRUMSCRIBE_S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY:-drumscribe-local}
      DRUMSCRIBE_S3_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:-local-development-only}
      DRUMSCRIBE_S3_SERVER_SIDE_ENCRYPTION: "none"
      DRUMSCRIBE_SESSION_SECRET: ${DRUMSCRIBE_SESSION_SECRET:-local-development-secret-change-before-deploying}
    command: ["celery", "-A", "drumscribe_api.tasks:celery_app", "worker", "--beat", "--loglevel=INFO", "--concurrency=1"]
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: infra/docker/web.Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000/api/v1}
        NEXT_PUBLIC_DEMO_MODE: ${NEXT_PUBLIC_DEMO_MODE:-false}
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000/api/v1}
      NEXT_PUBLIC_DEMO_MODE: ${NEXT_PUBLIC_DEMO_MODE:-false}
      API_ORIGIN: http://api:8000
      ADMIN_UI_KEY: ${ADMIN_UI_KEY:-}
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
    ports:
      - "127.0.0.1:3000:3000"
    restart: unless-stopped

volumes:
  postgres-data:
  valkey-data:
  minio-data:
